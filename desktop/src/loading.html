<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SDLC Agent</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(148, 163, 184, 0.3);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 18px;
        font-weight: 600;
      }
      .hint {
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div class="title">SDLC Agent 正在启动…</div>
    <div class="hint">首次启动需要初始化运行环境，请稍候</div>
  </body>
</html>
